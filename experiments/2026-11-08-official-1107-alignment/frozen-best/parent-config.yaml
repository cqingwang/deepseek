# =============================================================================
# DGX Spark 多机模型服务配置（单一真相源 SSOT）
#
# deploy.sh 读取本文件并按 engines.<engine>.models 路由。engine_dir 指向实际
# 启动器目录，env_dir 指向当前逻辑配方自己的受管环境目录；模型目录使用
# <model_path>/<org>/<model>。
# =============================================================================

common:
  user: chan
  # 四台 Spark 的管理面与 SSH 地址唯一登记处；物理节点默认顺序由 common.ring.nodes.rank 派生。
  spark_nodes:
    spark-a:
      hostname: spark-a
      ssh: chan@192.168.2.180
      management_ip: 192.168.2.180
      management_if: wlP9s9
    spark-b:
      hostname: spark-b
      ssh: chan@192.168.2.161
      management_ip: 192.168.2.161
      management_if: wlP9s9
    spark-c:
      hostname: spark-c
      ssh: chan@192.168.2.102
      management_ip: 192.168.2.102
      management_if: wlP9s9
    spark-d:
      hostname: spark-d
      ssh: chan@192.168.2.238
      management_ip: 192.168.2.238
      management_if: wlP9s9
  # 物理双平面环的唯一配置源；管理面仍只在 spark_nodes 中登记一次。
  ring:
    mtu: 9000
    roce_mtu: 4096
    roce_gid_index: 3
    hairpin_num_queues: 4
    hairpin_queue_size: 8192
    flow_steering_mode: hmfs
    hw_tc_offload: "on"
    # 通用物理环主机侧编排模块（源码位于 spark/ring/mesh）；这是 root/systemd
    # 特权运行时根，不是 target 私有 /opt/runtime_assets。
    mesh:
      runtime_root: /opt/spark-ring-mesh
      state_root: /run/spark-ring-mesh
      sparkring_commit: f16b5f43208c188c018c43820ccf52955006d1a5
      probe_source_sha256: 8684a6961b8e86aa474fa2310ff71e4cdf219a63a72ceb5593b2f95e54812792
    nodes:
      spark-a:
        rank: 0
        ports:
          - interface: enp1s0f0np0
            hca: rocep1s0f0
            cidr: 10.251.20.1/30
            neighbor: spark-b
            neighbor_ip: 10.251.20.2
          - interface: enp1s0f1np1
            hca: rocep1s0f1
            cidr: 10.251.20.14/30
            neighbor: spark-d
            neighbor_ip: 10.251.20.13
        ports2:
          - interface: enP2p1s0f0np0
            hca: roceP2p1s0f0
            cidr: 10.100.241.1/30
            neighbor: spark-b
            neighbor_ip: 10.100.241.2
          - interface: enP2p1s0f1np1
            hca: roceP2p1s0f1
            cidr: 10.100.241.14/30
            neighbor: spark-d
            neighbor_ip: 10.100.241.13
      spark-b:
        rank: 1
        ports:
          - interface: enp1s0f0np0
            hca: rocep1s0f0
            cidr: 10.251.20.2/30
            neighbor: spark-a
            neighbor_ip: 10.251.20.1
          - interface: enp1s0f1np1
            hca: rocep1s0f1
            cidr: 10.251.20.5/30
            neighbor: spark-c
            neighbor_ip: 10.251.20.6
        ports2:
          - interface: enP2p1s0f0np0
            hca: roceP2p1s0f0
            cidr: 10.100.241.2/30
            neighbor: spark-a
            neighbor_ip: 10.100.241.1
          - interface: enP2p1s0f1np1
            hca: roceP2p1s0f1
            cidr: 10.100.241.5/30
            neighbor: spark-c
            neighbor_ip: 10.100.241.6
      spark-c:
        rank: 2
        ports:
          - interface: enp1s0f0np0
            hca: rocep1s0f0
            cidr: 10.251.20.9/30
            neighbor: spark-d
            neighbor_ip: 10.251.20.10
          - interface: enp1s0f1np1
            hca: rocep1s0f1
            cidr: 10.251.20.6/30
            neighbor: spark-b
            neighbor_ip: 10.251.20.5
        ports2:
          - interface: enP2p1s0f0np0
            hca: roceP2p1s0f0
            cidr: 10.100.241.9/30
            neighbor: spark-d
            neighbor_ip: 10.100.241.10
          - interface: enP2p1s0f1np1
            hca: roceP2p1s0f1
            cidr: 10.100.241.6/30
            neighbor: spark-b
            neighbor_ip: 10.100.241.5
      spark-d:
        rank: 3
        ports:
          - interface: enp1s0f0np0
            hca: rocep1s0f0
            cidr: 10.251.20.10/30
            neighbor: spark-c
            neighbor_ip: 10.251.20.9
          - interface: enp1s0f1np1
            hca: rocep1s0f1
            cidr: 10.251.20.13/30
            neighbor: spark-a
            neighbor_ip: 10.251.20.14
        ports2:
          - interface: enP2p1s0f0np0
            hca: roceP2p1s0f0
            cidr: 10.100.241.10/30
            neighbor: spark-c
            neighbor_ip: 10.100.241.9
          - interface: enP2p1s0f1np1
            hca: roceP2p1s0f1
            cidr: 10.100.241.13/30
            neighbor: spark-a
            neighbor_ip: 10.100.241.14
  model_path: /opt/models
  # Runtime state, cache, logs, results and target-owned packed assets.
  # Every target owns one direct child named by its engine_id.
  runtime_assets_root: /opt/runtime_assets
  default_model: deepseek-ai/DeepSeek-V4.1-Flash-1017
  default_engine: deepseek
  api_url: http://0.0.0.0:8888/v1/models
  api_key: deepseek
  # DeepSeek/SGLang 并发默认值；当前站点预算为 9 路并发 x 1,000,000
  # 上下文 = 9,000,000 tokens，保留 600,000 tokens 余量（池 9,600,000）。
  # deploy.sh 将其映射到 MAX_RUNNING_REQUESTS 与 sparse admission MRR。
  max_request: 9
  # 业务层上下文上限；deploy.sh 按推理引擎映射为 CONTEXT_LENGTH 或 MAX_MODEL_LEN。
  # 受管部署只认本字段；.env.tp4.example 中的同名值仅用于独立启动。
  # 业务上下文上限；9 x 1,000,000 = 9,000,000 tokens，位于 9.6M 池预算内。
  max_token: 1000000
  # 请求级生成上限；由请求适配层映射到 OpenAI API 的 max_tokens 字段。
  max_tokens: 65536
  # 每个 batch 的 token 预算；DeepSeek/SGLang 映射为 --max-prefill-tokens。
  # 0.3.4 W-f 的 SGLang 默认有效值为 16384，改为显式登记后 target 不再依赖隐式默认。
  max_num_batched_tokens: 16384
  # 投机解码每步 draft token 上限；DeepSeek/DSPARK 映射为 gamma = mtp_num_tokens - 1。
  mtp_num_tokens: 6
  # thinking 默认开关；SGLang 的 SGLANG_DEFAULT_THINKING 是布尔量。
  default_thinking: false
  # thinking 模式默认推理预算；DeepSeek/SGLang 映射为 SGLANG_DSV41_REASONING_EFFORT。
  reasoning_effort: 75
  master_port: 25000

# `common.ring` 是所有 engine 共用的物理环网唯一 SSOT；common.spark_nodes
# 只登记管理网和 SSH inventory，不重复登记 fabric IP/HCA/端口。engine_dir 允许逻辑配方
# 复用经过验证的 launcher，但每个配方仍有独立的环境文件和容器命名空间。
# 引擎名不要求与 spark/ 下目录同名；start/stop 是可带参数的完整命令。
# 模型清单只登记需要管理的模型；role: target 可启动，role: draft 仅作为草稿依赖登记。
engines:
  deepseek:
    # spark-ds41f 路线（vLLM karmic-kraken-beta + TileLang + sparknet one-shot RoCE）。
    # 适配口径：deploy.sh/program.py 只生成 launcher 实际消费的宿主编排键，以及
    # common.spark_nodes/common.ring 必须覆盖的容器键。上游固定环境与 serve 参数
    # 保留在 .env.deepseek.example 和 start-tp4.sh；本文件不登记 max_token、
    # max_request、NCCL/serving 定值等上游固定项。
    # 宿主键不得进入容器；容器环境与上游 recipe.resolve(tp4-ring) 的逐 key 一致性
    # 由 tests/test_deepseek_env_merge_contract.py 锁定。
    enabled: true
    engine_dir: deepseek
    env_dir: deepseek
    start: start-tp4.sh serve
    stop: stop.sh
    remote_head: true
    env_file: .env.deepseek
    # 模板沿用点前缀惯例；上游 submodule .gitignore 的 `.env.*` 会吞掉点前缀
    # 文件，已在其 .gitignore 增加一行 `!.env.deepseek.example` 豁免（唯一的
    # 上游文件本地修改），保证 git 源码清单可见、sync 镜像完整。
    env_template: .env.deepseek.example
    # 官方 1107 runtime tree 的 spark-a 重建镜像。六个 source tree 与官方
    # 3f32 基线一致；vLLM patch-head 因公开 series 无法复现作者原提交而记录为
    # 实际回放得到的 2756478b，不能把本 image ID 冒充官方 3f32。
    # 生产回滚仍是 spark-ds41f:1030，上一轮 image03 也保留。
    image: spark-ds41f:1107-tree-exact
    image_id: sha256:7525b09690aeb666919f7a48071111a185c40edf85583c8d483b08ccb3bdf5d4
    allow_unverified_image: true
    ds41f_config_file: config/official-1107.cluster.json
    runtime_profile: experiments/2026-11-08-official-1107-alignment/profiles/run-02-proven-runtime.json
    skip_build: true
    nnodes: 4
    tensor_parallel_size: 4
    model_container_path: /models/DeepSeek-V4.1-Flash-1017
    # 站点 fabric 为 /30（common.ring），覆盖上游 tp4-ring profile 的 /24 默认值；
    # 前缀只能由父级拓扑派生（工程记忆：/30 地址与 rank 顺序不得在 target 重复登记）。
    nccl_ib_subnet_prefix_len_from_ring: true
    models:
      - id: deepseek-ai/DeepSeek-V4.1-Flash-1017
        role: target
      - id: deepseek-ai/DeepSeek-V4.1-Flash-1017-heretic
        role: target
